name: Boot-test Rosaline OS image

# Smoke-tests that a published image actually boots, not just that it
# built: builds a throwaway qcow2 test disk (see vm.toml) and runs
# scripts/boot-check.sh against it. Manual-only (see build.yml for why);
# `just smoke` / `just boot-check` are the same thing run locally.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to boot-test"
        default: "latest"
        required: false

env:
  IMAGE_NAME: rosaline-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  boot-test:
    name: Boot in QEMU
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Make KVM usable if present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Build qcow2 test disk
        run: |
          mkdir -p output
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v "$PWD/vm.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type qcow2 \
            --rootfs ext4 \
            --config /config.toml \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}"

      - name: Boot and wait for marker
        run: scripts/boot-check.sh output/qcow2/disk.qcow2 900

      - name: Upload serial console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-serial-log
          path: serial.log
          retention-days: 14
