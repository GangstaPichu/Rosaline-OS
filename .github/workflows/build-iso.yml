name: Build Rosaline OS ISO

# Builds an installable ISO from the already-published OCI image using
# bootc-image-builder. Runs after a successful image build, or manually.
on:
  workflow_run:
    workflows: ["Build Rosaline OS image"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: rosaline-os
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Build ISO with bootc-image-builder
        run: |
          mkdir -p output
          sudo podman run --rm -it --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v "$PWD/iso.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --config /config.toml \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rosaline-os-iso
          path: output/bootiso/*.iso
          retention-days: 14
