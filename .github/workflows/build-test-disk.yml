name: Build downloadable test disk

# Produces a bootable disk from the published image and uploads it as a
# workflow artifact, for testing on a machine where none of
# podman/bootc-image-builder/WSL2/KVM are available or wanted -- notably
# Windows without Hyper-V enabled. See README.md's "Testing on Windows
# without Hyper-V" section for what to do with the download.
#
# `format` picks bootc-image-builder's own output type directly (it
# supports vmdk natively -- no local `qemu-img convert` needed) so the
# artifact drops straight into VirtualBox/VMware, or qcow2 for plain
# QEMU. Defaults to vmdk.
#
# This does the same conversion as boot-test.yml but keeps producing a
# downloadable artifact as a separate concern from CI's own headless
# boot-check (which always uses qcow2), and skips the boot-check here
# so a slow artifact upload isn't blocked behind it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to convert"
        default: "latest"
        required: false
      format:
        description: "Disk format (vmdk for VirtualBox/VMware, qcow2 for plain QEMU)"
        type: choice
        options:
          - vmdk
          - qcow2
        default: vmdk

env:
  IMAGE_NAME: rosaline-os

jobs:
  build-disk:
    name: Build and upload disk
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compute lowercase image registry
        # See the same step in build.yml -- github.repository_owner
        # isn't lowercase and GHCR/OCI references must be.
        run: echo "IMAGE_REGISTRY=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Build test disk
        run: |
          mkdir -p output
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          FORMAT="${{ github.event.inputs.format || 'vmdk' }}"
          echo "FORMAT=${FORMAT}" >> "$GITHUB_ENV"
          # bootc-image-builder no longer pulls its target image itself
          # (found by actually running this workflow) -- it must already
          # be in local podman storage first.
          sudo podman pull "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}"
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/output:/output" \
            -v "$PWD/vm.toml:/config.toml:ro" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type "${FORMAT}" \
            --rootfs ext4 \
            --config /config.toml \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${TAG}"
          # bootc-image-builder writes as root (privileged container), so
          # output/<format>/ is root-owned -- the next step runs as the
          # normal runner user and needs read access to upload it (found
          # by actually running an earlier version of this that also
          # tried to write there: "gzip: disk.qcow2.gz: Permission
          # denied").
          sudo chown -R "$(id -u):$(id -g)" output
          ls -la "output/${FORMAT}/"

      - name: Upload disk image
        # No manual compression step here anymore -- measured on a real
        # run (disk.qcow2 at 6,599,841,792 bytes -> disk.qcow2.gz at
        # 6,520,050,761 bytes), gzip only shaved 1.2% off this file. The
        # disk is already too dense (RPM payloads, binaries) to compress
        # well, so a manual pigz pass was burning CI minutes for almost
        # nothing. compression-level: 0 skips upload-artifact's own
        # server-side zip compression too, for the same reason --
        # GitHub's own docs recommend 0 "for large files that are not
        # easily compressed, for significantly faster uploads". The
        # exact filename bootc-image-builder picks isn't documented, so
        # glob for it rather than hardcoding one (same approach
        # build-iso.yml already uses for its *.iso).
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rosaline-os-test-disk-${{ env.FORMAT }}
          path: output/${{ env.FORMAT }}/*
          compression-level: 0
          retention-days: 7
