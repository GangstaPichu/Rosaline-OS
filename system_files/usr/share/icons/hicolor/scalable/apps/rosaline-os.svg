  <g stroke="#2A0E18" stroke-width="2.5" stroke-opacity="0.35" stroke-linejoin="round">
    <use href="#petal" fill="#E0355F" transform="rotate(0 256 256)"/>
    <use href="#petal" fill="#7C4DBB" transform="rotate(82 256 256)"/>
    <use href="#petal" fill="#E0A83A" transform="rotate(172 256 256)"/>
    <use href="#petal" fill="#2E9CA6" transform="rotate(262 256 256)"/>
