<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gem" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#FDF3D8"/>
      <stop offset="45%" stop-color="#F0C265"/>
      <stop offset="100%" stop-color="#C68A2E"/>
    </radialGradient>
    <!-- petal: curved, asymmetric teardrop leaning right, base at center -->
