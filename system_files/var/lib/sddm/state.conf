# Preselects Cinnamon in the SDDM greeter's session list without logging
# anyone in automatically. This is a different mechanism from
# [Autologin] in /etc/sddm.conf(.d/): [Last] here only seeds the "last
# selected session" the greeter remembers and offers to overwrite on the
# next real login -- it never bypasses the login prompt.
#
# (An earlier attempt used [Autologin] Session=cinnamon with User= left
# blank, expecting SDDM to preselect without authenticating. In practice
# it authenticated an empty username anyway and dropped straight to the
# desktop with no login screen at all -- a real regression, not the
# fix. This file replaces that approach.)
[Last]
Session=cinnamon.desktop
User=
