# Cinnamon is Rosaline OS's actual differentiator from stock Bazzite, so
# it should be what people see first, not something they have to notice
# in the session picker. Setting [Autologin] Session= with User= left
# blank preselects it in the greeter without enabling autologin -- SDDM
# only auto-logs-in when both User and Session are set.
[Autologin]
Session=cinnamon
User=
