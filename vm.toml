# bootc-image-builder config for local/CI *test* VM disks only (see
# `just build-vm-image` / .github/workflows/boot-test.yml). Do NOT reuse
# this for the real installer ISO -- iso.toml stays separate on purpose
# so a real install always goes through Anaconda's normal interactive
# user-creation screen instead of getting this throwaway account.
#
# Bakes in a disposable "rosaline" / "rosaline" account (password login,
# wheel/sudo) purely so a test VM can be SSH'd into or logged into at the
# console. Never ship an image built with this config, and never reuse
# this password for anything real.
[[customizations.user]]
name = "rosaline"
password = "rosaline"
groups = ["wheel"]

# Route the kernel/systemd console to the serial port (last console= wins
# for /dev/console) so scripts/boot-check.sh can watch it with
# -display none; tty0 stays first so an interactive `just boot` window
# still shows output too.
[customizations.kernel]
append = "console=tty0 console=ttyS0,115200n8"

# If your bootc-image-builder version rejects a plaintext password (some
# builds require a pre-hashed one), replace the line above with a hash:
#   openssl passwd -6 rosaline
# and paste the "$6$..." result in as `password` instead.

# EXPERIMENT, not a confirmed fix: without this, bootc-image-builder
# auto-sizes the root partition to ~26.7GB (seen directly in a real
# run's `org.osbuild.truncate` stage) even though the actual content
# only needs ~6.6GB -- and the final `org.osbuild.qemu` raw-to-qcow2/
# vmdk conversion stage (28% of total build time, 222s in that same
# run) has to work across that whole disk. `minsize` is documented as a
# floor, not a cap, so this may not actually shrink anything if 26.7GB
# is content-driven rather than a default margin -- and there's a
# currently-open upstream bug (osbuild/bootc-image-builder#577) about
# filesystem customizations not always taking effect from a TOML
# config. Only keep this if a real run's log (grep for
# "org.osbuild.truncate" and the "qemu" stage's Duration, same as
# before) actually shows a smaller disk and a faster qemu stage --
# revert it otherwise rather than leave an unverified guess in place.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "10 GiB"
