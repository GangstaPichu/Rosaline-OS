<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <radialGradient id="gem" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="45%" stop-color="#F6D48C"/>
      <stop offset="100%" stop-color="#D9A84E"/>
    </radialGradient>
    <path id="petalLight" d="M 256,256
      C 226,222 214,160 222,108
      C 226,78 238,52 256,34
      L 256,256 Z"/>
    <path id="petalDark" d="M 256,34
      C 274,52 286,78 290,108
      C 298,160 286,222 256,256
      L 256,34 Z"/>

    <!-- shared crown: a small compass rose worn like a flower crown,
         same shape/colors as the main mark so the mascots read as
         "part of the same family" rather than a separate design -->
    <g id="crown">
      <g stroke="#7A5568" stroke-width="2" stroke-opacity="0.3" stroke-linejoin="round" transform="translate(-46,-46) scale(0.18)">
        <g transform="rotate(0 256 256)">
          <use href="#petalLight" fill="#F6AEBB"/>
          <use href="#petalDark" fill="#E06B82"/>
        </g>
        <g transform="rotate(90 256 256)">
          <use href="#petalLight" fill="#F8DDA0"/>
          <use href="#petalDark" fill="#E5AC49"/>
        </g>
        <g transform="rotate(180 256 256)">
          <use href="#petalLight" fill="#D2C2F2"/>
          <use href="#petalDark" fill="#9B7FD1"/>
        </g>
        <g transform="rotate(270 256 256)">
          <use href="#petalLight" fill="#ABDED2"/>
          <use href="#petalDark" fill="#5CA99B"/>
        </g>
      </g>
      <circle cx="0" cy="0" r="7.5" fill="url(#gem)" stroke="#7A5568" stroke-width="1.2"/>
    </g>

    <!-- one creature template, reused for both palette variants.
         Body/head drawn first, limbs and satchel on top so they
         aren't hidden behind the body silhouette. -->
    <g id="creatureBase">
      <ellipse cx="0" cy="-40" rx="112" ry="148"/>
      <circle cx="0" cy="-198" r="92"/>
      <!-- satchel strap + pouch, sitting out past the body's edge -->
      <line x1="-92" y1="-150" x2="-40" y2="10" stroke="#B98A56" stroke-width="10" stroke-linecap="round"/>
      <rect x="-78" y="-6" width="64" height="52" rx="12" fill="#C9A46B" stroke="#9C784A" stroke-width="3"/>
      <!-- relaxed arm, resting against the body -->
      <ellipse cx="-100" cy="-30" rx="20" ry="46" transform="rotate(-14 -100 -30)" fill-opacity="0.94"/>
      <!-- raised waving arm, clearly outside the head/body silhouette -->
      <ellipse cx="128" cy="-160" rx="19" ry="50" transform="rotate(55 128 -160)"/>
    </g>
  </defs>

  <!-- "Rosie", rose/gold palette -->
  <g transform="translate(200,500)">
    <use href="#creatureBase" fill="#F6AEBB"/>
    <g transform="translate(0,-198)">
      <circle cx="-34" cy="-4" r="11" fill="#5A3A44"/>
      <circle cx="34" cy="-4" r="11" fill="#5A3A44"/>
      <circle cx="-37" cy="-8" r="3.5" fill="#FFFFFF"/>
      <circle cx="31" cy="-8" r="3.5" fill="#FFFFFF"/>
      <ellipse cx="-56" cy="22" rx="16" ry="9" fill="#E8768C" opacity="0.55"/>
      <ellipse cx="56" cy="22" rx="16" ry="9" fill="#E8768C" opacity="0.55"/>
      <path d="M -22,30 Q 0,46 22,30" stroke="#5A3A44" stroke-width="4" fill="none" stroke-linecap="round"/>
      <use href="#crown" transform="translate(0,-78)"/>
    </g>
  </g>

  <!-- "Sage", teal/lavender palette, mirrored pose for variety -->
  <g transform="translate(600,500) scale(-1,1)">
    <use href="#creatureBase" fill="#ABDED2"/>
    <g transform="translate(0,-198)">
      <circle cx="-34" cy="-4" r="11" fill="#3E5A54"/>
      <circle cx="34" cy="-4" r="11" fill="#3E5A54"/>
      <circle cx="-37" cy="-8" r="3.5" fill="#FFFFFF"/>
      <circle cx="31" cy="-8" r="3.5" fill="#FFFFFF"/>
      <ellipse cx="-56" cy="22" rx="16" ry="9" fill="#5CA99B" opacity="0.5"/>
      <ellipse cx="56" cy="22" rx="16" ry="9" fill="#5CA99B" opacity="0.5"/>
      <path d="M -22,30 Q 0,46 22,30" stroke="#3E5A54" stroke-width="4" fill="none" stroke-linecap="round"/>
      <use href="#crown" transform="translate(0,-78)"/>
    </g>
  </g>
</svg>
